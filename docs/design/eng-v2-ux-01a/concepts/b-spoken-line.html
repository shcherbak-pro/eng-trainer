<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept B: Spoken Line</title>
<!-- ENG-V2-UX-01A static design mockup. Not production code. Fonts load from Google Fonts for review only;
     the proposal is to self-host them in the app. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..500&family=Source+Sans+3:ital,wght@0,400..700;1,400&display=swap">
<style>
  :root { --font-line: 'Literata', Georgia, serif; --font-ui: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif; }
  .light { color-scheme: light; --paper:#F5F6F9; --surface:#FFFFFF; --sunk:#E9EDF4; --ink:#172238; --ink-2:#38445C; --muted:#56627A; --rule:#DCE1EA; --field:#7A859B; --hl:#FFE27A; --hl-ink:#172238; --known:#17744A; --known-ink:#FFFFFF; --known-soft:#E2F3E9; --warn:#7A4F00; --warn-soft:#FFF3D1; --danger:#B3261E; --danger-ink:#FFFFFF; --ring:#2C5BD6; --scrim:rgba(15,22,36,.5); --inverse:#172238; --on-inverse:#F5F6F9; }
  .dark { color-scheme: dark; --paper:#0D1322; --surface:#151D30; --sunk:#1E2942; --ink:#E8ECF5; --ink-2:#C3CADA; --muted:#9CA6BC; --rule:#27324C; --field:#7D89A4; --hl:#FFD84D; --hl-ink:#0D1322; --known:#6CD19C; --known-ink:#0D1322; --known-soft:#16352A; --warn:#F3C35B; --warn-soft:#33290F; --danger:#FF8B82; --danger-ink:#0D1322; --ring:#8DB2FF; --scrim:rgba(0,0,0,.6); --inverse:#E8ECF5; --on-inverse:#0D1322; }

  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px; background: #CDD2DB; font-family: var(--font-ui); display: flex; flex-wrap: wrap; gap: 48px 40px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { font: 600 14px/1.3 var(--font-ui); color: #1B2333; margin: 0 0 10px; }
  .frame { position: relative; overflow: hidden; background: var(--paper); color: var(--ink); font: 400 16px/1.45 var(--font-ui); }
  .phone { width: 390px; height: 844px; }
  .desk { width: 1280px; height: 800px; display: grid; grid-template-columns: 248px 1fr; }
  button { font: inherit; color: inherit; }
  .i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .i.fill { fill: currentColor; stroke: none; }
  [lang="uk"] { font-family: var(--font-ui); }
  .focus-shown { outline: 2px solid var(--ring); outline-offset: 3px; border-radius: 6px; }

  /* App bar, tabs, fields */
  .appbar { height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 16px; }
  .appbar h1 { flex: 1; margin: 0; font: 650 23px/1.2 var(--font-ui); letter-spacing: -0.01em; }
  .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 12px; background: transparent; color: var(--ink); }
  .pass { height: 34px; display: inline-flex; align-items: center; gap: 4px; padding: 0 8px 0 12px; border: 1px solid var(--field); border-radius: 17px; background: var(--surface); font: 600 14px var(--font-ui); color: var(--ink); }
  .pass .i { width: 18px; height: 18px; }
  .tabs { display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--rule); }
  .tab { height: 44px; padding: 0 10px; border: 0; background: none; font: 600 15px var(--font-ui); color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.on { color: var(--ink); border-bottom-color: var(--ink); }
  .search { margin: 12px 16px 0; height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 1px solid var(--field); border-radius: 10px; background: var(--surface); color: var(--muted); font-size: 16px; }
  .search span { flex: 1; }
  .search small { font: 600 13px var(--font-ui); color: var(--muted); font-variant-numeric: tabular-nums; }
  .filters { display: flex; gap: 8px; padding: 10px 16px 12px; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, #000 86%, transparent); mask-image: linear-gradient(90deg, #000 86%, transparent); }
  .desk .filters, .toolbar .filter { -webkit-mask-image: none; mask-image: none; }
  .filter { height: 34px; display: inline-flex; align-items: center; gap: 4px; padding: 0 10px 0 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); font: 600 14px var(--font-ui); color: var(--ink-2); white-space: nowrap; }
  .filter .i { width: 18px; height: 18px; }

  /* Entry rows: lines on paper, not cards */
  .rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  .row { display: grid; grid-template-columns: 44px 1fr 44px; gap: 12px; padding: 14px 8px 14px 14px; border-bottom: 1px solid var(--rule); align-items: start; }
  .row.current { background: var(--surface); }
  .listen { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); }
  .listen.playing { background: var(--ink); color: var(--paper); }
  .line { margin: 0; font: 430 19px/1.32 var(--font-line); font-variation-settings: 'opsz' 19; color: var(--ink); text-wrap: pretty; }
  .ua { margin: 3px 0 0; font: 400 15.5px/1.4 var(--font-ui); color: var(--ink-2); }
  .ipa { margin: 2px 0 0; font: 400 14.5px/1.4 var(--font-ui); color: var(--muted); }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 7px; font: 500 13px/1.2 var(--font-ui); color: var(--muted); }
  .level { padding: 2px 5px; border: 1px solid var(--rule); border-radius: 4px; font-weight: 650; color: var(--ink-2); }
  .known { display: inline-flex; align-items: center; gap: 3px; color: var(--known); font-weight: 650; }
  .known .i { width: 16px; height: 16px; stroke-width: 2.25; }
  .star { color: var(--muted); }
  .star.on { color: var(--hl-ink); }
  .star.on .i { fill: var(--hl); stroke: var(--ink); }
  mark.spoken { color: inherit; background: linear-gradient(transparent 52%, var(--hl) 52%, var(--hl) 92%, transparent 92%); padding: 0 1px; }
  .dark mark.spoken { color: var(--hl); background: none; text-decoration: underline 3px var(--hl); text-underline-offset: 6px; }

  /* Bottom navigation: one row, five destinations */
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; padding-bottom: 10px; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--rule); }
  .tabbar a { display: grid; justify-items: center; align-content: center; gap: 2px; font: 600 12px var(--font-ui); color: var(--muted); text-decoration: none; }
  .tabbar a span.pill { width: 56px; height: 30px; display: grid; place-items: center; border-radius: 15px; }
  .tabbar a[aria-current] { color: var(--ink); }
  .tabbar a[aria-current] span.pill { background: var(--sunk); }

  .toast { position: absolute; left: 12px; right: 12px; bottom: 86px; display: flex; align-items: center; gap: 12px; padding: 10px 8px 10px 16px; border-radius: 12px; background: var(--inverse); color: var(--on-inverse); font: 500 15px/1.3 var(--font-ui); box-shadow: 0 6px 20px rgba(10,16,30,.25); }
  .toast span { flex: 1; }
  .toast button { height: 40px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--hl); font: 700 15px var(--font-ui); }
  .dark .toast button { color: #6E5000; }

  /* Buttons */
  .btn { height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 18px; border-radius: 12px; border: 1.5px solid transparent; font: 650 16px var(--font-ui); }
  .btn .i { width: 20px; height: 20px; }
  .btn.primary { background: var(--ink); color: var(--paper); }
  .btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--field); }
  .btn.quiet { background: transparent; color: var(--ink); border-color: transparent; padding: 0 10px; }
  .btn.known { background: var(--known); color: var(--known-ink); }
  .btn.danger { background: var(--danger); color: var(--danger-ink); }
  .btn.small { height: 40px; padding: 0 12px; font-size: 15px; border-radius: 10px; }
  .btn.wide { width: 100%; height: 56px; font-size: 17px; }

  /* Session stage */
  .session-top { height: 56px; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 8px; padding: 0 16px 0 6px; }
  .session-top strong { font: 650 16px var(--font-ui); }
  .session-top small { font: 600 15px var(--font-ui); color: var(--muted); font-variant-numeric: tabular-nums; }
  .progress { height: 4px; margin: 0 16px; border-radius: 2px; background: var(--rule); overflow: hidden; }
  .progress span { display: block; height: 100%; background: var(--ink); }
  .stage { position: absolute; top: 76px; bottom: 150px; left: 0; right: 0; display: grid; align-content: center; justify-items: center; gap: 14px; padding: 0 26px; text-align: center; }
  .topic { display: flex; gap: 8px; align-items: center; font: 600 14px var(--font-ui); color: var(--muted); }
  .term { margin: 6px 0 0; font: 470 42px/1.12 var(--font-line); font-variation-settings: 'opsz' 42; letter-spacing: -0.012em; text-wrap: balance; }
  .term-ipa { font: 400 18px/1.3 var(--font-ui); color: var(--muted); }
  .audio { display: flex; gap: 10px; margin-top: 6px; }
  .prompt { margin: 16px 0 0; max-width: 28ch; font: 400 16px/1.45 var(--font-ui); color: var(--ink-2); }
  .dock { position: absolute; left: 16px; right: 16px; bottom: 24px; display: grid; gap: 10px; }
  .dock p { margin: 0; text-align: center; font: 500 14px var(--font-ui); color: var(--muted); }
  .answer-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .answer-row .btn { height: 60px; font-size: 17px; }
  .revealed { position: absolute; top: 76px; left: 0; right: 0; bottom: 120px; padding: 22px 24px 0; display: grid; align-content: start; gap: 6px; }
  .revealed .small-term { font: 470 30px/1.15 var(--font-line); font-variation-settings: 'opsz' 30; margin: 0; }
  .revealed .meaning { margin: 18px 0 0; font: 650 27px/1.25 var(--font-ui); }
  .example { margin-top: 18px; padding: 14px 4px 0; border-top: 1px solid var(--rule); display: grid; grid-template-columns: 1fr 44px; gap: 8px; align-items: start; }
  .example p { margin: 0; font: italic 420 19px/1.45 var(--font-line); font-variation-settings: 'opsz' 19; }
  .also { margin-top: 12px; font: 400 15.5px/1.45 var(--font-ui); color: var(--ink-2); }

  /* Home */
  .section { padding: 18px 16px 6px; }
  .section h2 { margin: 0 0 10px; font: 650 17px/1.3 var(--font-ui); }
  .resume { margin: 8px 16px 0; padding: 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--rule); }
  .resume h2 { margin: 0; font: 650 19px/1.3 var(--font-ui); }
  .resume p { margin: 4px 0 14px; color: var(--ink-2); }
  .resume .btns { display: flex; gap: 10px; }
  .daily .line { font-size: 26px; font-variation-settings: 'opsz' 26; }
  .daily .actions { display: flex; gap: 8px; margin-top: 12px; }
  .blocks { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  .blocks li { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--rule); font: 600 16px var(--font-ui); }
  .blocks li span { flex: 1; }
  .blocks li small { font: 500 14px var(--font-ui); color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Notices, dialogs, import review */
  .notice { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 12px 14px; border-radius: 12px; font: 400 15px/1.45 var(--font-ui); }
  .notice.warn { background: var(--warn-soft); color: var(--ink); }
  .notice.warn .i { color: var(--warn); }
  .check { display: flex; gap: 10px; align-items: center; min-height: 44px; font: 600 15px var(--font-ui); }
  .box { width: 22px; height: 22px; border: 2px solid var(--field); border-radius: 5px; display: grid; place-items: center; background: var(--surface); }
  .box.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .box .i { width: 16px; height: 16px; stroke-width: 2.5; }
  .field label { display: block; font: 600 14px var(--font-ui); color: var(--ink-2); margin-bottom: 6px; }
  .input { height: 46px; display: flex; align-items: center; padding: 0 12px; border: 1px solid var(--field); border-radius: 10px; background: var(--surface); font-size: 16px; }
  .import-card { margin: 4px 16px 0; padding: 16px; border: 1.5px dashed var(--field); border-radius: 14px; display: grid; gap: 10px; background: var(--surface); }
  .import-card h2 { margin: 0; font: 650 17px var(--font-ui); }
  .import-card p { margin: 0; font-size: 15px; color: var(--ink-2); }
  .review { padding: 18px 16px 0; display: grid; gap: 12px; }
  .review h2 { margin: 0; font: 650 20px/1.3 var(--font-ui); justify-self: start; padding: 0 2px; }
  .counts { display: flex; gap: 8px; }
  .count { padding: 4px 10px; border-radius: 6px; background: var(--sunk); font: 650 14px var(--font-ui); }
  .count.warn { background: var(--warn-soft); color: var(--warn); }
  .entries { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  .entries li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 11px 2px; border-bottom: 1px solid var(--rule); }
  .entries .en { font: 450 17px/1.3 var(--font-line); font-variation-settings: 'opsz' 17; }
  .entries .tag { align-self: start; padding: 2px 8px; border-radius: 6px; font: 650 13px var(--font-ui); background: var(--sunk); color: var(--ink-2); }
  .entries .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .entries small { grid-column: 1 / -1; font: 400 13.5px var(--font-ui); color: var(--muted); }
  .actionbar { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; padding: 12px 16px 22px; background: var(--surface); border-top: 1px solid var(--rule); }
  .scrim { position: absolute; inset: 0; background: var(--scrim); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 20px 26px; border-radius: 20px 20px 0 0; background: var(--surface); display: grid; gap: 12px; box-shadow: 0 -10px 30px rgba(10,16,30,.25); }
  .sheet .handle { width: 40px; height: 5px; border-radius: 3px; background: var(--rule); justify-self: center; }
  .sheet h2 { margin: 6px 0 0; font: 650 22px/1.25 var(--font-ui); }
  .sheet p, .sheet li { font-size: 16px; color: var(--ink-2); }
  .sheet p { margin: 0; }
  .sheet ul { margin: 0; padding-left: 20px; display: grid; gap: 2px; }
  .sheet .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  .blocked { position: absolute; inset: 0; padding: 0 28px; display: grid; align-content: center; gap: 14px; }
  .blocked h1 { margin: 0; font: 650 27px/1.2 var(--font-ui); letter-spacing: -0.01em; }
  .blocked p { margin: 0; color: var(--ink-2); font-size: 16.5px; }
  .blocked ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; font-size: 16.5px; }
  .waiting { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--sunk); font: 600 15px var(--font-ui); }
  .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--rule); border-top-color: var(--ink); }
  .details { font: 600 14px var(--font-ui); color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .details .i { width: 18px; height: 18px; }

  /* Desktop */
  .side { background: var(--surface); border-right: 1px solid var(--rule); padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; }
  .brand { padding: 4px 10px 18px; }
  .brand b { display: block; font: 600 21px/1.1 var(--font-line); font-variation-settings: 'opsz' 21; }
  .brand small { font: 500 13px var(--font-ui); color: var(--muted); }
  .group { margin: 14px 10px 4px; font: 650 13px var(--font-ui); color: var(--muted); }
  .nav { height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 8px; font: 600 15px var(--font-ui); color: var(--ink-2); text-decoration: none; }
  .nav .i { width: 20px; height: 20px; }
  .nav.sub { padding-left: 40px; height: 34px; font-weight: 500; }
  .nav[aria-current] { background: var(--sunk); color: var(--ink); font-weight: 650; }
  .nav em { margin-left: auto; font: normal 600 13px var(--font-ui); color: var(--muted); }
  .side .foot { margin-top: auto; display: grid; gap: 2px; border-top: 1px solid var(--rule); padding-top: 10px; }
  .main { display: grid; grid-template-rows: auto auto 1fr; min-width: 0; }
  .main-head { display: flex; align-items: flex-end; gap: 16px; padding: 22px 28px 0; }
  .main-head h1 { margin: 0; font: 650 30px/1.1 var(--font-ui); letter-spacing: -0.015em; }
  .main-head p { margin: 0 0 3px; color: var(--muted); font-weight: 600; }
  .main-head .pass { margin-left: auto; }
  .toolbar { display: flex; gap: 10px; align-items: center; padding: 16px 28px 14px; }
  .toolbar .search { margin: 0; width: 420px; }
  .split { display: grid; grid-template-columns: 520px 1fr; min-height: 0; border-top: 1px solid var(--rule); }
  .split .rows { border-top: 0; overflow: hidden; }
  .split .row { padding-left: 28px; }
  .split .row.current { box-shadow: inset 3px 0 0 var(--ink); }
  .stand { background: var(--surface); border-left: 1px solid var(--rule); padding: 30px 40px; display: grid; align-content: start; gap: 4px; }
  .stand .t { margin: 0; font: 470 46px/1.1 var(--font-line); font-variation-settings: 'opsz' 46; letter-spacing: -0.015em; }
  .stand .ipa { font-size: 19px; margin: 0 6px 0 0; }
  .ipa-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .stand .acts { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 8px; padding-top: 14px; border-top: 1px solid var(--rule); }
  .known-out { color: var(--known); border-color: var(--known); }
  .stand .meaning { margin: 14px 0 0; font: 600 24px/1.3 var(--font-ui); }
  .stand .example { max-width: 60ch; }
  .kbd { position: absolute; right: 28px; bottom: 18px; display: flex; gap: 14px; font: 500 13px var(--font-ui); color: var(--muted); }
  kbd { display: inline-block; min-width: 22px; padding: 0 5px; margin-right: 4px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 5px; font: 650 12px/18px var(--font-ui); text-align: center; color: var(--ink-2); background: var(--paper); }
</style>
</head>

  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6.5 9.5l5.5 5.5 5.5-5.5"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path d="M4.5 14.5V19a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-4.5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4.5M12 17.4v.1"/></symbol>
  <symbol id="i-again" viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.2-5.1"/><path d="M5 4.5v4h4"/></symbol>
