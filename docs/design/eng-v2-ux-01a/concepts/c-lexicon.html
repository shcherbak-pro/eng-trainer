<style>
  :root { --sans: 'Source Sans 3', 'Segoe UI', sans-serif; --serif: 'Source Serif 4', Georgia, serif; }
  .light { color-scheme: light; --paper:#FFFFFF; --page:#F4F5F7; --ink:#1C1D22; --ink-2:#3D404A; --muted:#5E6270; --rule:#E3E4E8; --field:#80838F; --accent:#8A2432; --accent-soft:#F7E9EB; --sel:#EEF0F4; --ring:#2A55C9; --t1:#2B7A78; --t2:#9A6A12; --t3:#74498A; --t4:#4A6274; --t5:#557428; --t6:#A2482B; --known:#1F7A4D; --star:#C98A00; }
  .dark { color-scheme: dark; --paper:#121317; --page:#0C0D10; --ink:#E8E9ED; --ink-2:#C3C6CF; --muted:#9A9EAB; --rule:#2A2C33; --field:#7A7E8B; --accent:#F08A98; --accent-soft:#3A1E24; --sel:#1E2028; --ring:#8DB2FF; --t1:#5CC2BF; --t2:#E0B45A; --t3:#C29BD6; --t4:#93AFC4; --t5:#A7C873; --t6:#E8957A; --known:#6CCB98; --star:#F2C14E; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px; background: #CDD2DB; font-family: var(--sans); display: flex; flex-wrap: wrap; gap: 48px 40px; align-items: flex-start; }
  figure { margin: 0; } figcaption { font: 600 14px/1.3 var(--sans); color: #1B2333; margin: 0 0 10px; }
  .frame { position: relative; overflow: hidden; background: var(--paper); color: var(--ink); font: 400 16px/1.45 var(--sans); }
  .phone { width: 390px; height: 844px; } .desk { width: 1280px; height: 800px; display: grid; grid-template-columns: 220px 460px 1fr; }
  .i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .head { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px 6px; }
  .head h1 { margin: 0; font: 700 24px var(--sans); letter-spacing: -0.01em; }
  .head small { font: 600 14px var(--sans); color: var(--muted); }
  .thumbs { display: flex; gap: 6px; padding: 6px 16px 10px; border-bottom: 1px solid var(--rule); overflow: hidden; }
  .th { height: 34px; display: inline-flex; align-items: center; gap: 7px; padding: 0 10px 0 0; border-radius: 6px; background: var(--page); font: 600 14px var(--sans); color: var(--ink-2); white-space: nowrap; overflow: hidden; }
  .th::before { content: ''; width: 6px; align-self: stretch; background: var(--c); }
  .th.on { background: var(--ink); color: var(--paper); }
  .entries { list-style: none; margin: 0; padding: 0; }
  .e { position: relative; padding: 10px 16px 10px 22px; border-bottom: 1px solid var(--rule); }
  .e::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); }
  .hw { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .hw b { font: 700 17.5px/1.25 var(--sans); }
  .hw .ipa { font: 400 14px var(--sans); color: var(--muted); }
  .hw .st { margin-left: auto; display: flex; gap: 6px; align-items: center; color: var(--muted); }
  .hw .st .i { width: 18px; height: 18px; }
  .hw .st .f { color: var(--star); fill: var(--star); stroke: var(--star); }
  .hw .st .k { color: var(--known); stroke-width: 2.4; }
  .tr { margin: 1px 0 0; font: 400 15.5px/1.35 var(--sans); color: var(--ink); }
  .exm { margin: 3px 0 0; font: italic 400 15px/1.4 var(--serif); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .e.open { background: var(--sel); }
  .e.open .exm { white-space: normal; }
  .row-acts { display: flex; gap: 6px; margin-top: 8px; }
  .ra { height: 36px; display: inline-flex; align-items: center; gap: 5px; padding: 0 10px; border: 1px solid var(--field); border-radius: 6px; background: var(--paper); font: 600 14px var(--sans); }
  .ra .i { width: 17px; height: 17px; }
  .bottom { position: absolute; left: 0; right: 0; bottom: 0; background: var(--paper); border-top: 1px solid var(--rule); }
  .bsearch { margin: 10px 12px 6px; height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 23px; border: 1.5px solid var(--ink); background: var(--paper); color: var(--muted); font-size: 16px; }
  .tabs5 { display: grid; grid-template-columns: repeat(5,1fr); height: 56px; padding-bottom: 6px; }
  .tabs5 span { display: grid; justify-items: center; align-content: center; gap: 1px; font: 600 11.5px var(--sans); color: var(--muted); }
  .tabs5 span.on { color: var(--accent); }
  .tabs5 .i { width: 22px; height: 22px; }
  /* index card */
  .icard { position: absolute; left: 18px; right: 18px; top: 110px; height: 460px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); box-shadow: 0 1px 0 var(--rule), 0 18px 32px -18px rgba(20,22,30,.35); padding: 0 22px; }
  .icard .top { height: 54px; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid var(--t1); font: 600 14px var(--sans); color: var(--muted); }
  .icard .top .dir { margin-left: auto; padding: 3px 8px; border-radius: 4px; background: var(--page); color: var(--ink-2); }
  .icard .ruled { height: 380px; background: repeating-linear-gradient(transparent 0 33px, var(--rule) 33px 34px); display: grid; align-content: center; gap: 12px; text-align: left; }
  .icard .prompt-ua { font: 600 30px/1.2 var(--sans); }
  .icard .say { font: italic 400 17px var(--serif); color: var(--ink-2); }
  .drill-acts { position: absolute; left: 18px; right: 18px; top: 592px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .drill-acts span { height: 54px; display: grid; place-items: center; border: 1px solid var(--field); border-radius: 6px; font: 650 15px var(--sans); }
  .drill-acts span.p { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .meter { position: absolute; left: 18px; right: 18px; top: 74px; display: flex; justify-content: space-between; font: 600 14px var(--sans); color: var(--muted); }
  /* desktop */
  .pane { border-right: 1px solid var(--rule); min-width: 0; overflow: hidden; }
  .ti { padding: 18px 0; background: var(--page); }
  .ti h2 { margin: 0 18px 10px; font: 700 13px var(--sans); color: var(--muted); }
  .ti .t { position: relative; display: flex; justify-content: space-between; padding: 8px 16px 8px 22px; font: 600 15px var(--sans); color: var(--ink-2); }
  .ti .t::before { content: ''; position: absolute; left: 0; top: 4px; bottom: 4px; width: 6px; border-radius: 0 3px 3px 0; background: var(--c); }
  .ti .t small { font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ti .t.on { background: var(--paper); color: var(--ink); }
  .ti .t.on::before { width: 8px; }
  .lst .dsearch { margin: 16px; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid var(--field); border-radius: 6px; color: var(--muted); }
  .lst .dsearch kbd { margin-left: auto; }
  .entry { padding: 30px 40px; }
  .entry .hw2 { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .entry .hw2 b { font: 700 40px/1.1 var(--sans); letter-spacing: -0.015em; }
  .entry .hw2 span { font: 400 20px var(--sans); color: var(--muted); }
  .entry .lab { margin-top: 8px; display: flex; gap: 8px; font: 600 13.5px var(--sans); color: var(--muted); }
  .entry .lab span { padding: 2px 7px; border-radius: 4px; background: var(--page); }
  .entry .sense { margin-top: 22px; display: grid; grid-template-columns: 26px 1fr; gap: 4px 6px; }
  .entry .sense .n { font: 700 18px var(--sans); color: var(--accent); }
  .entry .sense .d { font: 600 21px/1.35 var(--sans); }
  .entry .sense .x { grid-column: 2; font: italic 400 19px/1.5 var(--serif); color: var(--ink-2); }
  .entry .syn { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--rule); font-size: 16px; color: var(--ink-2); }
  .entry .syn b { color: var(--ink); }
  .entry .acts { display: flex; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
  kbd { display: inline-block; min-width: 20px; padding: 0 5px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; font: 650 12px/18px var(--sans); text-align: center; color: var(--ink-2); background: var(--paper); }
  .keys { position: absolute; right: 24px; bottom: 16px; display: flex; gap: 14px; font: 500 13px var(--sans); color: var(--muted); }
</style>
</head>
