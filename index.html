<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f9" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>English Assessment Trainer</title>
    <script>
      // Applies the system theme before the app starts. A saved theme preference
      // lives in IndexedDB and is applied by the app as soon as it has been read.
      (() => {
        const resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePreference = 'system';
        document.documentElement.style.colorScheme = resolved;

        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          themeColor.setAttribute('content', resolved === 'dark' ? '#0d1322' : '#f5f6f9');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
